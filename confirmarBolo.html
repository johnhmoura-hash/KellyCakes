<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar pedido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/montarBolo.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <header class="mb-header">
    <div class="mb-wrap mb-header-inner">
      <a class="mb-brand" href="portfolio.html"><img src="img/logoHeader.png" alt="Kelly Cakes"></a>
      <nav aria-label="Navegação principal">
        <a href="portfolio.html#sabores">Como montar?</a>
        <a href="portfolio.html#pedido">Como pedir</a>
        <a href="portfolio.html#contato">Contato</a>
        <a href="portfolio.html">Catálogo</a>
        
        <a class="mb-cart" href="carrinho.html" aria-label="Carrinho"><i class="bi bi-cart"></i></a>
      </nav>
    </div>
  </header>
    <main>
    <section class="mb-hero">
      <div class="mb-wrap mb-hero-content">
        <h1>CONFIRMAR PAGAMENTO</h1>
        <p>revise seus dados, escolha uma forma de pagamento e finalize seu pedido.</p>
      </div>
    </section>

        <!-- ETAPAS -->

        <div class="etapas">

            <div class="etapa concluida">

                <div class="etapa-numero">
                    1
                </div>

                <span>
                    Identificação
                </span>

            </div>


            <div class="etapa atual">

                <div class="etapa-numero">
                    2
                </div>

                <span>
                    Pagamento
                </span>

            </div>


            <div class="etapa">

                <div class="etapa-numero">
                    3
                </div>

                <span>
                    Finalização
                </span>

            </div>

        </div>


        <!-- DADOS DO CLIENTE -->

        <section class="pagamento-secao">

            <h2>
                1. Dados do cliente
            </h2>

            <div class="cliente-card">

                <div class="cliente-icones">

                    <i class="bi bi-person"></i>

                    <i class="bi bi-envelope"></i>

                    <i class="bi bi-telephone"></i>

                </div>


                <div class="cliente-dados">
                    <strong>
                        Maria do Bairro
                    </strong>
                    <span>
                        MariaBairro@gmail.com
                    </span>
                    <span>
                        (79) 92222-4444
                    </span>
                </div>
                <button class="btn-editar" type="button">
                    Editar
                </button>
            </div>
        </section>


        <!-- PAGAMENTO -->

        <section class="pagamento-secao">
            <h2>
                2. Dados de pagamento
            </h2>
            <div class="pagamento-card">


                <!-- CARTÃO -->
                <label class="opcao-pagamento">
                    <input
                        type="radio"
                        name="pagamento"
                        value="cartao"
                        checked
                    >

                    <span class="radio-personalizado"></span>
                    <div>
                        <strong>
                            Cartão
                        </strong>
                        <small>
                            Em até 12x com juros
                        </small>
                    </div>
                </label>
                <!-- PIX -->

                <label class="opcao-pagamento">
                    <input
                        type="radio"
                        name="pagamento"
                        value="pix"
                    >
                    <span class="radio-personalizado"></span>
                    <div>
                        <strong>
                            Pix
                        </strong>
                        <small>
                            Pagamento instantâneo
                        </small>
                    </div>
                </label>


                <!-- BOLETO -->

                <label class="opcao-pagamento">
                    <input
                        type="radio"
                        name="pagamento"
                        value="boleto"
                    >
                    <span class="radio-personalizado"></span>

                    <div>
                        <strong>
                            Boleto bancário
                        </strong>
                        <small>
                            Até 2 dias com compensação
                        </small>
                    </div>
                </label>
            </div>
        </section>


        <!-- CONTINUAR -->

        <button class="btn-continuar" type="button">
            Continuar
        </button>

    </main>


    <script>

        const opcoesPagamento =
            document.querySelectorAll('.opcao-pagamento');

        opcoesPagamento.forEach(opcao => {

            opcao.addEventListener('click', () => {

                opcoesPagamento.forEach(item => {
                    item.classList.remove('selecionada');
                });

                opcao.classList.add('selecionada');

            });

        });

    </script>
  </main>

</body>

</html>
