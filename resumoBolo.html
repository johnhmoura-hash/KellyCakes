<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumo do pedido | Kelly Cakes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/montarBolo.css">
  <link rel="stylesheet" href="css/cart.css">
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
</head>

<body>
<div data-kc-header></div>
  <main>
    <section class="mb-hero">
      <div class="mb-wrap mb-hero-content">
        <h1>Monte seu bolo do<br>seu <em>jeito</em></h1>
        <p>Escolha cada detalhe e deixe seu<br>momento ainda mais especial.</p>
      </div>
    </section>
    <section class="mb-summary mb-wrap" aria-labelledby="summary-title">
      <h2 id="summary-title">Resumo do seu bolo</h2>
      <div id="summary-content"></div>
      <div class="mb-total">
        <p>Valor total do pedido:</p><strong id="total-price">R$ 0,00</strong>
        <button id="add-to-cart" type="button">Adicionar ao carrinho</button>
        <p id="cart-message" class="mb-cart-message" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="js/resumoBolo.js"></script>
  <script src="js/header.js"></script>
</body>

</html>
